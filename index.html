<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jobello</title>
<meta name="description" content="Mes candidatures, mes relances et mon planning, au même endroit.">
<meta name="theme-color" content="#E0457B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jobello">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg: #2a1418; --fg: #eef3f1; --muted: #9fb0aa; --accent: #FF8A65; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 40px rgba(255,138,101,.3); }
  h1 { margin: 6px 0 0; font-size: 2rem; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); max-width: 30ch; }
  a.go { margin-top: 10px; display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--accent); color: #3a0f17; font-weight: 700; text-decoration: none; }
  small { color: var(--muted); font-size: .8rem; max-width: 34ch; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-512.png" alt="">
  <h1>Jobello</h1>
  <p>Mes candidatures, mes relances et mon planning, au même endroit.</p>
  <a class="go" id="go" href="https://claude.ai/artifact/SaG6YjELrJB4iXapKyS2tg">Ouvrir mon carnet</a>
  <small>Ton carnet s'ouvre dans claude.ai, là où Claude lit tes mails et prépare tes dossiers.</small>
</main>
<script>
  // Ouverture directe : un toucher sur l'icône mène tout de suite au carnet.
  setTimeout(function () { location.href = document.getElementById("go").href; }, 600);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
